[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stereo-calibration-lab"
version = "0.1.0"
description = "Validated stereo camera calibration, rectification validation, and fiducial pose estimation using OpenCV."
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
